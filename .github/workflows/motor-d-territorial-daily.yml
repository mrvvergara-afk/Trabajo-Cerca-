name: Motor D - Barrido territorial 12 comunas
on:
  workflow_dispatch:
  pull_request:
    branches: [main, fix/motor-d-ocr-bridge-20261108]
    paths:
      - 'automation/motor_d_territorial_daily.py'
      - 'automation/test_motor_d_territorial.py'
      - 'automation/motor_d_express.py'
      - 'automation/test_motor_d_express.py'
      - 'automation/adaptar_radar_a_motor_d_review.py'
      - 'automation/test_motor_d_review_adapter.py'
      - '.github/workflows/motor-d-territorial-daily.yml'
  push:
    branches: [main]
    paths:
      - 'automation/motor_d_territorial_daily.py'
      - 'automation/test_motor_d_territorial.py'
      - 'automation/motor_d_express.py'
      - 'automation/test_motor_d_express.py'
      - 'automation/adaptar_radar_a_motor_d_review.py'
      - 'automation/test_motor_d_review_adapter.py'
      - '.github/workflows/motor-d-territorial-daily.yml'
  schedule:
    # Four daily scans at 06:15, 10:15, 14:15, 18:15 in Chile during daylight saving time.
    # GitHub Actions uses UTC; local times move back one hour in Chilean winter.
    - cron: '15 9,13,17,21 * * *'
permissions:
  contents: write
jobs:
  # Integration PR only: real web coverage test, read-only GitHub token.
  # Never create publication batches, push files or contact the AppDeploy importer.
  territorial_audit_pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'fix/motor-d-ocr-bridge-20261108'
    concurrency:
      group: motor-d-pr-audit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-cost territorial readers
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Audit real public sources in all 12 communes without publishing
        run: python automation/motor_d_territorial_daily.py
      - name: Verify real-world source coverage honestly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("automation/motor_d_discovery/territorial_daily.json").read_text())
          assert len(report["communes_expected"])==12 and not report["missing_communes"]
          print("PR_TERRITORIAL_AUDIT",json.dumps({
              "sources_checked":report["sources_total"],
              "sources_accessible":report["sources_accessible"],
              "sources_blocked":report["sources_blocked"],
              "candidate_links_not_approved_jobs":report["job_candidates_total"],
              "ready_candidates_not_published":report["express_ready_candidates"],
              "actual_published":0,
          },ensure_ascii=False))
          if report["sources_accessible"]==0:
              raise SystemExit("PR_TERRITORIAL_AUDIT_FAILURE: no accessible source")
          PY
      - name: Clasificar candidatos reales y contrastar URLs con catálogo · sin publicar
        env:
          PYTHONPATH: automation:automation/trabajo_cerca
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from motor_d_express import build, validate_inventory_freshness
          from radar_diario import read_feed, canonical
          source=Path("automation/motor_d_discovery/territorial_daily.json")
          report=json.loads(source.read_text(encoding="utf-8"))
          today=datetime.now(ZoneInfo("America/Santiago")).date()
          validate_inventory_freshness(report,today)
          classified=build(report,today)
          ready=[entry["offer"] for state in ("EXPRESS","RECUPERACION")
                 for entry in classified[state] if entry["offer"]]
          try:
              catalog,complete,rows,error=read_feed(max_pages=30)
          except Exception as exc:
              catalog,complete,rows,error=set(),False,0,type(exc).__name__
          evidence=[]
          for offer in ready:
              source_url=canonical(offer["url_original"])
              evidence.append({
                  "id_fuente":offer["id_fuente"],
                  "cargo":offer["cargo"],"empresa":offer["empresa"],
                  "comunas":offer["comunas"],"url_original":offer["url_original"],
                  "fecha_publicacion":offer["fecha_publicacion"],
                  "fecha_cierre":offer.get("fecha_cierre"),
                  "batch_type":offer["tipo_lote"],
                  "catalog_url_status":("already_in_public_catalog" if source_url in catalog
                      else "not_found_by_url_only" if complete else "catalog_unavailable")
              })
          summary={
              "schema":"trabajo-cerca.motor-d-pr-preview.v1",
              "scan_date":report["date"],
              "source_scan_count":report["sources_total"],
              "possible_links_not_verified":report["job_candidates_total"],
              "daily_ready":len(classified["EXPRESS"]),
              "recovery_ready":len(classified["RECUPERACION"]),
              "second_pass":len(classified["SEGUNDA_PASADA"]),
              "third_pass":len(classified["TERCERA_PASADA"]),
              "excluded":len(classified["DESCARTADO"]),
              "duplicate_candidates":len(classified["DUPLICADO"]),
              "feed_complete":complete,
              "feed_rows":rows,
              "feed_error":error,
              "publications_created":0,
              "catalog_semantic_dedup_not_yet_verified":True,
              "ready_candidates":evidence
          }
          target=Path("automation/motor_d_discovery/territorial_pr_preview.json")
          target.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("PR_MOTOR_D_READY_PREVIEW",json.dumps({
              k:v for k,v in summary.items() if k!="ready_candidates"
          },ensure_ascii=False))
          for entry in evidence:
              print("PR_MOTOR_D_CANDIDATE",json.dumps(entry,ensure_ascii=False))
          PY
      - name: Recover full audit even if sources fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-d-pr-real-source-audit
          path: |
            automation/motor_d_discovery/territorial_daily.json
            automation/motor_d_discovery/territorial_state.json
            automation/motor_d_discovery/territorial_pr_preview.json
          if-no-files-found: warn

  territorial_scan:
    if: github.event_name != 'pull_request'
    concurrency:
      group: trabajo-cerca-motor-d-ready-writers
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install zero-cost HTML parser
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Check Python script compiles
        run: python -m py_compile automation/motor_d_territorial_daily.py automation/motor_d_express.py
      - name: Run territorial integrity tests
        run: python -m unittest discover -s automation -p 'test_motor_d_*.py' -v
      # Operational test after enabling bounded B/C; D remains an independent scout.
      - name: Scan all 12 communes and identify source problems
        if: github.event_name != 'pull_request'
        run: python automation/motor_d_territorial_daily.py
      - name: Classify express offers and write bounded publication batches
        if: github.event_name != 'pull_request'
        run: python automation/motor_d_express.py
      - name: Enforce honest source coverage accounting
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path("automation/motor_d_discovery/territorial_daily.json")
          if not p.exists():
              print("MOTOR_D_FAILURE: no source report produced")
              sys.exit(1)
          r=json.loads(p.read_text())
          assert len(r["communes_expected"])==12 and not r["missing_communes"]
          print("MOTOR_D_COVERAGE",json.dumps({
              "sources_checked":r["sources_total"],
              "sources_accessible":r["sources_accessible"],
              "sources_blocked":r["sources_blocked"],
              "candidates_found":r["job_candidates_total"],
              "published":r["published_in_trabajo_cerca"]},ensure_ascii=False))
          if r["sources_accessible"]==0:
              print("MOTOR_D_FAILURE: all sources inaccessible")
              sys.exit(1)
          PY
      - name: Persist deduplication state and per-source report for next run
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "trabajo-cerca-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/motor_d_discovery/territorial_state.json automation/motor_d_discovery/territorial_daily.json automation/motor_d_ready/
          if ! git diff --cached --quiet; then
            git commit -m "data(motor-d): update 12-commune daily discovery state [skip ci]"
            # A simultaneous source edit is not a failed scan. Rebase and retry
            # instead of losing the report to a non-fast-forward push.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "MOTOR_D_PERSIST_CONFLICT: preserve the audit artifact for reconciliation"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "MOTOR_D_PERSIST_OK attempt=$attempt"
                exit 0
              fi
              sleep 2
            done
            echo "MOTOR_D_PERSIST_FAILED: all safe retries exhausted"
            exit 1
          fi
      - name: Preserve complete territorial audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-d-territorial-audit
          path: automation/motor_d_discovery/territorial_daily.json
          if-no-files-found: warn
