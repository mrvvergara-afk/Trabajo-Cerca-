name: Mulchen shared verifier evidence
on:
  push:
    branches: [fix/verificador-compartido-mulchen-2026-10-29]
    paths: ['integrations/appdeploy/house-ads/backend/**','integrations/appdeploy/house-ads/qa/mulchen*','.github/workflows/verificador-mulchen.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: integrations/appdeploy/house-ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Official source evidence
        run: python qa/mulchen-capture.py
      - name: Build actual verifier and application components
        run: node qa/mulchen-build.mjs
      - name: Type-check shared verification closure
        run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --types node --skipLibCheck backend/public-source-verification.ts
      - name: Independent motor paths and verification regressions
        run: node --test qa/mulchen-verifier.test.mjs
      - name: Read deployed catalog through SDK
        run: node qa/mulchen-live-observe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mulchen-evidence
          path: integrations/appdeploy/house-ads/qa-output/
          retention-days: 7
