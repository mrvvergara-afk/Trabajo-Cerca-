name: QA compact radar footer + place badges — no deploy
on:
  push:
    branches: [fix/ubicaciones-y-pie-compacto-20261114]
    paths:
      - 'ux-staging/appdeploy-1794590590707/preview/**'
      - '.github/workflows/ux-compact-radar-footer-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-compact-radar-footer
  cancel-in-progress: true
jobs:
  compact-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: ux-staging/appdeploy-1794590590707/preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        run: npm install --no-audit --no-fund
      - name: Test municipality labels and privacy/footer invariants
        run: node qa/test-workplace-footer.cjs
      - name: Compile React/Vite with isolated SDK
        run: npm run build -- --config vite.qa.config.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve isolated preview
        run: |
          nohup npm run dev -- --config vite.qa.config.ts --host 127.0.0.1 --port 4173 --strictPort >/tmp/compact-radar-qa.log 2>&1 &
          for i in $(seq 1 40);do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/;then exit 0;fi
            sleep 1
          done
          cat /tmp/compact-radar-qa.log
          exit 1
      - name: Check radar/footer/news responsiveness
        run: node qa/e2e-workplace-footer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-mobile-radar-footer
          path: ux-staging/appdeploy-1794590590707/preview/qa/captures-footer/*.png
          if-no-files-found: ignore
          retention-days: 5
