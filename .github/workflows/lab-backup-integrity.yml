name: LAB offline backup integrity gate
on:
  pull_request:
    paths:
      - scripts/backup-safety-gate.mjs
      - .github/workflows/lab-backup-integrity.yml
  push:
    branches:
      - qa/lab-release-smoke-20261120
    paths:
      - scripts/backup-safety-gate.mjs
      - .github/workflows/lab-backup-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-backup-integrity:
    name: Validate synthetic export and in-memory rehydration
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify integrity rules without any actual customer data
        run: node scripts/backup-safety-gate.mjs --self-test
