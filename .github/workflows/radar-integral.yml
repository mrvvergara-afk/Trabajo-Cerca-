name: Radar repair verification and real read-only crawl
on:
  push:
    branches: [repair/radar-integral-2026-10-28]
    paths: ['integrations/appdeploy/house-ads/**', '!integrations/appdeploy/house-ads/package-lock.json', '.github/workflows/radar-integral.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: integrations/appdeploy/house-ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: radar-integral-evidence-and-source-package
          run-id: 40673298389
          github-token: ${{ github.token }}
          path: integrations/appdeploy/house-ads/qa-output/previous
      - name: Reconcile native PDF dependency in isolated runner
        run: npm install --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - name: Compile real frontend and backend; no deployment
        run: |
          node qa/radar-bundle.mjs
          node qa/radar-verify.mjs
      - name: Regression tests on repaired native modules
        run: node --test qa/radar-repair.test.mjs
      - name: Strict native backend types against the existing SDK reference
        run: npx tsc -p qa/radar-native-tsconfig.json
      - name: Strict frontend types against the existing SDK reference
        run: npx tsc -p qa/radar-frontend-tsconfig.json
      - name: Read public catalogue and territorial DOM
        continue-on-error: true
        run: node qa/radar-live-observe.mjs
      - name: Process complete source inventory with A and B on common URLs
        if: success()
        env:
          RADAR_PREVIOUS: qa-output/previous/qa-output/radar/crawl.json
        run: node qa/radar-real-crawl.mjs
      - name: Verify original target evidence and application destinations
        run: node qa/radar-target-proof.mjs
      - name: Install free local OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.7 pytesseract==0.3.13 Pillow==11.3.0
      - name: Preserve existing repository and application regression results
        continue-on-error: true
        run: node qa/radar-existing-tests.mjs
      - name: Continue actual PDF and image queue with local OCR
        env:
          OMP_THREAD_LIMIT: '1'
          RADAR_PREVIOUS_OCR: qa-output/previous/qa-output/radar/ocr.json
        run: node qa/radar-ocr.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-integral-evidence-and-source-package
          path: |
            integrations/appdeploy/house-ads/qa-output/radar/
            integrations/appdeploy/house-ads/qa-output/radar-live/
            integrations/appdeploy/house-ads/package-lock.json
          retention-days: 2
