name: Trabajo Cerca - PoC documental gratis
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lector-documental-lab.yml
      - tools/trabajo_cerca_lector_documental.py
      - tools/test_lector_documental.py
  push:
    branches:
      - poc/lector-documental-gratis-2026-10-25
    paths:
      - .github/workflows/lector-documental-lab.yml
      - tools/trabajo_cerca_lector_documental.py
      - tools/test_lector_documental.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leer-documentos:
    name: Extraer candidatos de fuentes publicas (solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar OCR local y lector PDF sin proveedor externo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
          python -m pip install --disable-pip-version-check --quiet 'pymupdf>=1.24,<2' 'pytesseract>=0.3.10,<1' 'pillow>=10,<13'
      - name: Pruebas locales con datos sinteticos
        run: python -m unittest discover -s tools -p 'test_lector_documental.py' -v
      - name: Diagnóstico de accesibilidad API y guardia administrativa, sin credenciales
        run: python tools/probe_appdeploy_api.py
      - name: Lector de muestra municipal pública, sin dependencia de API
        run: |
          python tools/trabajo_cerca_lector_documental.py \
            --input docs/muestra-documentos-municipales-publicos.json \
            --max-items 6 --output reporte_municipal.json
      - name: Descubrir anuncios individuales enlazados desde índices municipales
        run: |
          python -m unittest discover -s tools -p 'test_descubrir_ofertas_municipales.py' -v
          python tools/descubrir_ofertas_municipales.py \
            --input docs/muestra-documentos-municipales-publicos.json \
            --max-indexes 3 --max-links 4 --output reporte_descubrimiento.json
      - name: Leer primeras 15 referencias REALES de cola, sin escribir en app
        run: |
          python tools/trabajo_cerca_lector_documental.py \
            --max-items 15 --offset 0 --output reporte_documental.json
      - name: Adjuntar evidencia de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lector-documental-solo-lectura
          path: |
            reporte_documental.json
            reporte_municipal.json
            reporte_descubrimiento.json
            diagnostico_api.json
          if-no-files-found: ignore
          retention-days: 7
