name: Sync Trabajo Cerca public catalog identities

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - '.github/workflows/sync-public-catalog.yml'
      - 'automation/sync_catalog_identities.py'
      # Refresh the live identity mirror when the independent ChatGPT producer
      # records a wave; this does not trigger for the mirror's own [skip ci] commit.
      - 'automation/chatgpt_coverage/**'
  workflow_run:
    workflows: ['Motor D - Barrido territorial 12 comunas']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: trabajo-cerca-catalog-identities-mirror
  cancel-in-progress: false

jobs:
  mirror:
    # An independent D sweep can retry the mirror even when GitHub delays
    # ordinary scheduled workflows. Never mirror after a failed D run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1

      - name: Synchronize catalog with bounded recovery for concurrent pushes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Trabajo Cerca Catalog Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            echo "CATALOG_SYNC_ATTEMPT=${attempt}/3"
            # Other motors can update main between checkout and push.
            # Start each attempt from the newest main and regenerate from the API.
            git fetch origin main
            git checkout -B catalog-sync-work origin/main
            if ! python3 automation/sync_catalog_identities.py; then
              echo "::error::CATALOG_SOURCE_UNAVAILABLE; previous validated mirror preserved"
              exit 1
            fi
            git add automation/catalog_public_identities.json
            if git diff --cached --quiet -- automation/catalog_public_identities.json; then
              echo "CATALOG_SYNC_NO_CHANGE"
              exit 0
            fi
            git commit -m 'chore(catalog): refresh audited public job identities [skip ci]'
            if git push origin HEAD:main; then
              echo "CATALOG_SYNC_PUBLISHED"
              exit 0
            fi
            echo "::warning::CATALOG_PUSH_RACE attempt=${attempt}; regenerating from latest main"
            sleep $((attempt * 3))
          done
          echo "::error::CATALOG_PUSH_RETRIES_EXHAUSTED; mirror may be stale"
          exit 1
