name: AppDeploy availability — LAB and official (read only)
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/appdeploy-availability-watch.mjs
      - scripts/appdeploy-availability-watch.test.mjs
      - .github/workflows/appdeploy-availability-watch.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: trabajo-cerca-availability-watch
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate availability classification without HTTP probes
        run: node --test scripts/appdeploy-availability-watch.test.mjs
      - name: Check two public endpoints twice and report only state changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/appdeploy-availability-watch.mjs
