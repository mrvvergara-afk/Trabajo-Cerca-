name: QA UX Radar / Autocampañas Hotfix — no deploy
on:
  push:
    branches: [fix/ux-carousel-visual-radar-footer-20261114]
    paths:
      - 'ux-staging/appdeploy-1794590590707/preview/**'
      - '.github/workflows/ux-carousel-radar-footer-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ux-hotfix-autocampanas-radar
  cancel-in-progress: true
jobs:
  hotfix-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ux-staging/appdeploy-1794590590707/preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate source and campaign rules
        run: node qa/test-hotfix.cjs
      - name: Build full isolated frontend
        run: npm run build -- --config vite.qa.config.ts
      - run: npx playwright install --with-deps chromium
      - name: Start isolated UI
        run: |
          nohup npm run dev -- --config vite.qa.config.ts --host 127.0.0.1 --port 4173 --strictPort >/tmp/ux-hotfix.log 2>&1 &
          for i in $(seq 1 40);do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/;then exit 0;fi
            sleep 1
          done
          cat /tmp/ux-hotfix.log
          exit 1
      - name: Assert 12 town labels, no pause, real art and footer
        run: node qa/e2e-hotfix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-hotfix-visual-captures
          path: ux-staging/appdeploy-1794590590707/preview/qa/captures-hotfix/*.png
          retention-days: 5
          if-no-files-found: ignore
