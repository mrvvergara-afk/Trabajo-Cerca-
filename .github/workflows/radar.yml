name: Radar local
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'automation/motor_a_handoff.py'
      - '.github/workflows/radar.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'automation/motor_a_handoff.py'
      - 'scripts/apify_existing_results.py'
      - 'scripts/verify_candidates.py'
      - 'scripts/apify_run_bounded.py'
      - '.github/workflows/radar.yml'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  motor_a_contract:
    name: QA Motor A descubrimiento + traspaso a D
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar 12 comunas, deduplicación, rotación y handoff A a D
        env:
          PYTHONPATH: scripts:automation
        run: |
          python -m py_compile scripts/radar.py scripts/backfill.py scripts/chiletrabajos_direct.py scripts/verify_candidates.py scripts/motor_a_handoff.py automation/motor_a_handoff.py
          python -m unittest discover -s scripts -p 'test_motor_a_*.py' -v
  scan:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/radar.py
      - run: python scripts/backfill.py
      - run: python scripts/chiletrabajos_direct.py
      - run: python scripts/verify_candidates.py
        env:
          VERIFY_LIMIT: '60'
      - name: Transferir fichas A con ubicación acreditada a revisión de Motor D
        run: python scripts/motor_a_handoff.py
      - name: Persistir el checkpoint y las fichas A para el barrido D
        run: |
          git config user.name "trabajo-cerca-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/motor_a_review/pending.json automation/motor_a_review/state.json
          if ! git diff --cached --quiet; then
            git commit -m "data(motor-a): preserve D source-review handoff [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "MOTOR_A_HANDOFF_REBASE_CONFLICT; original evidence preserved in artifact"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "MOTOR_A_HANDOFF_PERSISTED attempt=$attempt"
                exit 0
              fi
              sleep 2
            done
            echo "MOTOR_A_HANDOFF_PERSIST_FAILED"
            exit 1
          fi
      - run: python scripts/apify_probe.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
      - run: python scripts/apify_run_bounded.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_RUN_ENABLED: 'false'
      - run: python scripts/apify_existing_results.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-candidatos
          path: output/
          retention-days: 7
