name: Radar local
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11,17 * * *'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/radar.py
      - run: python scripts/backfill.py
      - run: python scripts/chiletrabajos_direct.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-candidatos
          path: output/
          retention-days: 7
