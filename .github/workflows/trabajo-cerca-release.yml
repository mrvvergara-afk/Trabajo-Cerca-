# This workflow is a real AppDeploy MCP release executor, but all real deploys
# remain fail-closed until the owner's credentials and DR evidence are supplied.
# Keep runner code from trusted main; read candidate payload as data only.
name: Trabajo Cerca — self-service production release
run-name: TC PROD ${{ inputs.candidate_sha }} @ ${{ inputs.production_baseline }} [${{ inputs.dry_run && 'DRY' || 'LIVE' }}]
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable candidate commit with release/payload.json
        type: string
        required: true
      production_baseline:
        description: AppDeploy official snapshot expected before deploy
        type: string
        required: true
      dry_run:
        description: Verify owner credential and API health only; never deploy
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: trabajo-cerca-production-release
  cancel-in-progress: false
jobs:
  release:
    name: Approve, deploy, verify and roll back code on failure
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout trusted release runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove local runner rejects unsafe changes (no API token)
        run: node --test scripts/release-runner.test.mjs
      - name: Validate immutable SHA and official baseline
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PRODUCTION_BASELINE: ${{ inputs.production_baseline }}
        run: |
          node --input-type=module -e '
            const validSha=/^[a-f0-9]{40}$/i.test(process.env.CANDIDATE_SHA || "");
            const validVersion=/^[0-9]{12,20}$/.test(process.env.PRODUCTION_BASELINE || "");
            if(!validSha || !validVersion) {
              process.stderr.write("Invalid release identifiers\\n"); process.exit(1);
            }
          '
      - name: Require candidate commit to be part of reviewed main history
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          git fetch --no-tags --depth=150 origin main
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main || {
            echo "::error::Candidate is not in trusted main history"
            exit 1
          }
      - name: Checkout approved candidate AS DATA ONLY
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: approved-candidate
          persist-credentials: false
      - name: Read immutable candidate payload without running its code
        run: |
          test -f approved-candidate/release/payload.json
          cp approved-candidate/release/payload.json ./release/payload.json
      - name: Deploy via authenticated AppDeploy MCP, verify and roll back if needed
        env:
          TC_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TC_PRODUCTION_BASELINE: ${{ inputs.production_baseline }}
          TC_RELEASE_ENABLE: ${{ vars.TC_RELEASE_ENABLE }}
          # A signed independent recovery and QA proof must be produced by
          # a separate restore drill. Dates/checkboxes cannot unlock deploy.
          TC_RELEASE_PROOF_JSON: ${{ secrets.TC_RELEASE_PROOF_JSON }}
          TC_RELEASE_PROOF_SIGNATURE: ${{ secrets.TC_RELEASE_PROOF_SIGNATURE }}
          TC_RELEASE_PROOF_PUBLIC_KEY: ${{ secrets.TC_RELEASE_PROOF_PUBLIC_KEY }}
          TC_APPDEPLOY_MCP_TOKEN: ${{ secrets.TC_APPDEPLOY_MCP_TOKEN }}
          TC_RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/release-runner.mjs
      - name: Report protected LIVE result to registered LAB with signed OIDC
        if: always() && inputs.dry_run == false
        env:
          RELEASE_STATUS: ${{ job.status }}
          RELEASE_CANDIDATE: ${{ inputs.candidate_sha }}
          RELEASE_BASELINE: ${{ inputs.production_baseline }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { operationalLabApi } from './scripts/trabajo-cerca-environments.mjs';
          const laboratory=operationalLabApi();
          if(!laboratory) {
            console.log('Laboratorio operativo pendiente de identificación. Se omite la conexión.');
            process.exit(0);
          }
          const u=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const t=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!u||!t)throw Error('GitHub OIDC unavailable for release result');
          const tokenResponse=await fetch(u+(u.includes('?')?'&':'?')+
            'audience=trabajo-cerca-release-result-v1',
            {headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(10000)});
          if(!tokenResponse.ok)throw Error('OIDC result token HTTP '+tokenResponse.status);
          const jwt=(await tokenResponse.json()).value;
          const result=process.env.RELEASE_STATUS;
          const response=await fetch(
            laboratory+'/api/internal/release/poll',
            {method:'POST',redirect:'error',
              headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},
              body:JSON.stringify({
                action:'complete',
                candidateSha:process.env.RELEASE_CANDIDATE,
                baseline:process.env.RELEASE_BASELINE,
                runId:process.env.RELEASE_RUN_ID,
                dryRun:false,
                outcome:result,
              }),
              signal:AbortSignal.timeout(15000)});
          if(!response.ok)throw Error('LAB release result recording HTTP '+response.status);
          console.log('TC_RELEASE_OIDC_FINAL_STATUS_RECORDED');
          NODE
