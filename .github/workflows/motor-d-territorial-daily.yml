name: Motor D - Barrido territorial 13 comunas
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'automation/motor_d_territorial_daily.py'
      - 'automation/test_motor_d_territorial.py'
      - 'automation/motor_d_express.py'
      - 'automation/test_motor_d_express.py'
      - '.github/workflows/motor-d-territorial-daily.yml'
  push:
    branches: [main]
    paths:
      - 'automation/motor_d_territorial_daily.py'
      - 'automation/test_motor_d_territorial.py'
      - 'automation/motor_d_express.py'
      - 'automation/test_motor_d_express.py'
      - '.github/workflows/motor-d-territorial-daily.yml'
  schedule:
    # Four daily scans at 06:15, 10:15, 14:15, 18:15 in Chile during daylight saving time.
    # GitHub Actions uses UTC; local times move back one hour in Chilean winter.
    - cron: '15 9,13,17,21 * * *'
permissions:
  contents: write
concurrency:
  group: trabajo-cerca-motor-d-territorial
  cancel-in-progress: false
jobs:
  territorial_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-cost HTML parser
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Check Python script compiles
        run: python -m py_compile automation/motor_d_territorial_daily.py automation/motor_d_express.py
      - name: Run territorial integrity tests
        run: python -m unittest discover -s automation -p 'test_motor_d_*.py' -v
      # Operational test after enabling bounded B/C; D remains an independent scout.
      - name: Scan all 12 communes and identify source problems
        if: github.event_name != 'pull_request'
        run: python automation/motor_d_territorial_daily.py
      - name: Classify express offers and write bounded publication batches
        if: github.event_name != 'pull_request'
        run: python automation/motor_d_express.py
      - name: Enforce honest source coverage accounting
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path("automation/motor_d_discovery/territorial_daily.json")
          if not p.exists():
              print("MOTOR_D_FAILURE: no source report produced")
              sys.exit(1)
          r=json.loads(p.read_text())
          assert len(r["communes_expected"])==13 and not r["missing_communes"]
          print("MOTOR_D_COVERAGE",json.dumps({
              "sources_checked":r["sources_total"],
              "sources_accessible":r["sources_accessible"],
              "sources_blocked":r["sources_blocked"],
              "candidates_found":r["job_candidates_total"],
              "published":r["published_in_trabajo_cerca"]},ensure_ascii=False))
          if r["sources_accessible"]==0:
              print("MOTOR_D_FAILURE: all sources inaccessible")
              sys.exit(1)
          PY
      - name: Persist deduplication state and per-source report for next run
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "trabajo-cerca-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/motor_d_discovery/territorial_state.json automation/motor_d_discovery/territorial_daily.json automation/motor_d_ready/
          if ! git diff --cached --quiet; then
            git commit -m "data(motor-d): update 12-commune daily discovery state [skip ci]"
            # A simultaneous source edit is not a failed scan. Rebase and retry
            # instead of losing the report to a non-fast-forward push.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "MOTOR_D_PERSIST_CONFLICT: preserve the audit artifact for reconciliation"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "MOTOR_D_PERSIST_OK attempt=$attempt"
                exit 0
              fi
              sleep 2
            done
            echo "MOTOR_D_PERSIST_FAILED: all safe retries exhausted"
            exit 1
          fi
      - name: Preserve complete territorial audit
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: motor-d-territorial-audit
          path: automation/motor_d_discovery/territorial_daily.json
          if-no-files-found: warn
