name: Motor D - Social public access audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/motor_d_social_access_probe.py'
      - 'automation/motor_d_social_browser.py'
      - '.github/workflows/motor-d-social-access.yml'
  schedule:
    - cron: '40 11,23 * * *'
permissions:
  contents: read
concurrency:
  group: motor-d-social-public-access
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public browser tooling
        run: |
          python -m pip install 'playwright>=1.48,<2'
          python -m playwright install --with-deps chromium
      - name: Validate scripts
        run: |
          python -m py_compile automation/motor_d_social_access_probe.py automation/motor_d_social_browser.py
      - name: Probe public HTTP with robots restrictions
        run: python automation/motor_d_social_access_probe.py
      - name: Probe public social pages in real browser
        run: python automation/motor_d_social_browser.py
      - name: Preserve access and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-access-audit
          path: |
            automation/motor_d_discovery/social_access_status.json
            automation/motor_d_discovery/social_browser_status.json
          if-no-files-found: warn
