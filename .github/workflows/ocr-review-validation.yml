name: OCR review and importer contract
on:
  workflow_dispatch:
  pull_request:
    branches: [main, fix/motor-d-ocr-bridge-20261108]
  push:
    branches: [fix/motor-d-ocr-bridge-20261108]
permissions:
  contents: read
jobs:
  offline-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'pymupdf>=1.24,<2'
      - name: Motor D and real deployed importer contract, isolated database
        run: python -m unittest discover -s automation -p 'test*.py' -v
      - name: Radar, documents and territorial regressions
        run: python -m unittest discover -s automation/trabajo_cerca -p 'test*.py' -v
