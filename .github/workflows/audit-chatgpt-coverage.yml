name: Audit ChatGPT territorial coverage (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '35 0,4,8,12,16,20 * * *'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run audit regression tests
        run: python3 -m unittest automation/test_audit_chatgpt_coverage.py
      - name: Audit latest coverage against current inventory
        shell: bash
        run: |
          set -euo pipefail
          chile_date="$(TZ=America/Santiago date +%Y%m%d)"
          latest="automation/chatgpt_coverage/${chile_date}.json"
          if [ ! -f "$latest" ]; then
            echo "::warning::Coverage not yet available for Chile date ${chile_date}; no successful coverage claim"
            exit 0
          fi
          python3 automation/audit_chatgpt_coverage.py --coverage "$latest" --output /tmp/chatgpt-coverage-audit.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/chatgpt-coverage-audit.json'))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## ChatGPT coverage audit\n\n')
              f.write('Sources: {}/{}; effective reads: {}; attempted: {}.\n\n'.format(r['recorded_sources'],r['inventory_endpoints'],r['effective_reads'],r['attempted']))
              f.write('Daily attempt coverage complete: **{}**; effective complete: **{}**.\n'.format(r['daily_attempt_coverage_complete'],r['daily_effective_coverage_complete']))
          PY
