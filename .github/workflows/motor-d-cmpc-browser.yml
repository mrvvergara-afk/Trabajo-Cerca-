name: Motor D - CMPC browser discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/motor-d-cmpc-browser.yml'
      - 'automation/motor_d_cmpc_browser.py'
      - 'automation/prepare_motor_d_batch.py'
      - 'automation/stage_cmpc_approved_batch.py'
      - 'automation/test_motor_d_cmpc_stage.py'
      - 'automation/stage_motor_d_handoff.py'
      - 'automation/motor_d_audit_sources.json'
      - 'automation/motor_d_audit_discovery.py'
  workflow_dispatch:
  schedule:
    # Browser fallback is the proven official public reader when the GitHub
    # Cornerstone JSON request returns HTTP 401. Scan shortly after D:
    # 06:35, 10:35, 14:35 and 18:35 Chile summer time (UTC-3).
    # This uses the existing guarded batch/dedup pipeline, no AppDeploy deploy.
    - cron: '35 9,13,17,21 * * *'
permissions:
  contents: write
concurrency:
  group: motor-d-cmpc-public-discovery
  cancel-in-progress: false
jobs:
  cmcp_discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.48,<2' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
          python -m playwright install --with-deps chromium
      - name: Verify Python
        run: python -m py_compile automation/motor_d_cmpc_browser.py automation/prepare_motor_d_batch.py automation/motor_d_audit_discovery.py automation/stage_cmpc_approved_batch.py
      - name: Test guarded CMPC -> AppDeploy bridge
        run: python -m unittest discover -s automation -p 'test_motor_d_cmpc_stage.py' -v
      - name: Discover public CMPC requisitions
        run: python automation/motor_d_cmpc_browser.py
      - name: Examine audited public sources and preserve pending evidence
        run: python automation/motor_d_audit_discovery.py
      - name: Validate official jobs and prepare approved batch
        run: python automation/prepare_motor_d_batch.py
      - name: Check generated import batch before delivery
        run: |
          python - <<'PY'
          import json, pathlib, re
          p=pathlib.Path("automation/motor_d_approved.json")
          if not p.exists():
              print("NO_APPROVED_OFFERS: no batch; this is not successful publication")
          else:
              obj=json.loads(p.read_text(encoding="utf-8"))
              assert obj["schema_version"]==1 and obj["approval"]=="approved_for_publication"
              assert re.fullmatch(r"motor-[de]-[A-Za-z0-9_-]{8,55}",obj["batch_id"])
              assert 1<=len(obj["offers"])<=15
              for x in obj["offers"]:
                  assert x["url_original"].startswith("https://") and x["fecha_publicacion"]
              print("APPROVED_BATCH_VALID",len(obj["offers"]))
          PY
      - name: Stage fresh approved CMPC requisitions into real AppDeploy-ready queue
        if: success() && github.ref == 'refs/heads/main'
        run: python automation/stage_cmpc_approved_batch.py
      - name: Persist discoverable evidence and AppDeploy-ready batches in one commit
        if: success()
        run: |
          git config user.name "trabajo-cerca-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/motor_d_discovery/cmpc_discovery.json automation/motor_d_discovery/evaluacion_cmcp.json automation/motor_d_discovery/auditoria_fuentes.json
          # Entregar solamente el lote generado de fichas oficiales que pasaron validación.
          # AppDeploy verifica URL/identidad, deduplica con catálogo vivo y publica mediante su pipeline.
          # Stage addition, replacement OR removal: no stale approved batch survives.
          git add -A automation/motor_d_approved.json automation/motor_d_ready/
          if ! git diff --cached --quiet; then
            git commit -m "data(cmpc): evidence and approved import bridge [skip ci]"
            # The territorial scanner may update the same index concurrently.
            # A failed rebase is NOT successful publication: preserve artifacts
            # and exit nonzero; next scheduled scan retries fresh evidence.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "CMPC_STAGING_CONFLICT: index changed; rerun live evidence"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "CMPC_BRIDGE_STAGED_OK attempt=$attempt"
                exit 0
              fi
              sleep 2
            done
            echo "CMPC_STAGING_FAILED: safe retries exhausted"
            exit 1
          fi
      - name: Upload evidence (not approved for publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-d-cmpc-evidence
          path: |
            automation/motor_d_discovery/
            automation/motor_d_approved.json
            automation/motor_d_ready/
          if-no-files-found: warn
