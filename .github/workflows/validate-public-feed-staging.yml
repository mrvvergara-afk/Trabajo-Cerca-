name: Validate public feed staging snapshot
on:
  pull_request:
    paths:
      - 'appdeploy_staging/snapshot/**'
      - 'scripts/test-public-feed-*.mjs'
      - '.github/workflows/validate-public-feed-staging.yml'
  workflow_dispatch:
jobs:
  static-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run staging integrity checks
        run: node --test scripts/test-public-feed-snapshot.mjs scripts/test-public-feed-diagnostics.mjs
