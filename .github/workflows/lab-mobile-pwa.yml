name: LAB mobile PWA interaction gate
on:
  push:
    branches:
      - qa/lab-release-smoke-20261120
    paths:
      - scripts/lab-mobile-pwa.mjs
      - .github/workflows/lab-mobile-pwa.yml
  pull_request:
    paths:
      - scripts/lab-mobile-pwa.mjs
      - .github/workflows/lab-mobile-pwa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tc-lab-mobile-pwa
  cancel-in-progress: true
jobs:
  mobile-pwa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Test isolated LAB mobile UI and PWA
        run: node scripts/lab-mobile-pwa.mjs
      - name: Verify official view unchanged and opt-in compact release preview
        run: node scripts/prod-preview-canary.mjs
