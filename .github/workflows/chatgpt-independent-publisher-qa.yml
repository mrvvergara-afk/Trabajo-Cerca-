name: ChatGPT independent publication staging QA
on:
  push:
    branches:
      - fix/chatgpt-autonomo-origen-diseno-20261113
    paths:
      - 'automation/stage_chatgpt_handoff.py'
      - 'automation/test_stage_chatgpt_handoff.py'
      - 'automation/chatgpt_extraction_contract.py'
      - 'automation/chatgpt_extraction_schema.json'
      - 'automation/test_chatgpt_extraction_contract.py'
      - 'automation/chatgpt_ready/**'
      - 'appdeploy_staging/chatgpt-*.ts'
      - 'appdeploy_staging/motor-d-auto-import.ts'
      - '.github/workflows/chatgpt-independent-publisher-qa.yml'
  pull_request:
    paths:
      - 'automation/stage_chatgpt_handoff.py'
      - 'automation/test_stage_chatgpt_handoff.py'
      - 'automation/chatgpt_extraction_contract.py'
      - 'automation/chatgpt_extraction_schema.json'
      - 'automation/test_chatgpt_extraction_contract.py'
      - 'automation/chatgpt_ready/**'
      - 'appdeploy_staging/chatgpt-*.ts'
      - 'appdeploy_staging/motor-d-auto-import.ts'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict ChatGPT batch contract tests
        run: python -m unittest automation.test_stage_chatgpt_handoff automation.test_chatgpt_extraction_contract -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all modified TypeScript modules without modifying app
        run: |
          npx --yes --package=esbuild@0.25.12 esbuild appdeploy_staging/chatgpt-url-identity.ts --format=esm --platform=node --packages=external --outfile=/tmp/chatgpt-url-identity.mjs
          node --input-type=module -e "import {canonicalSourceHash,canonicalSourceUrl} from '/tmp/chatgpt-url-identity.mjs'; if(canonicalSourceUrl('https://www.empresa.example/jobs/123?utm_source=search&a=2&b=1#post')!=='https://empresa.example/jobs/123?a=2&b=1')process.exit(1); if(canonicalSourceHash('https://www.empresa.example/jobs/123?utm_source=search&a=2&b=1#post')!=='b1836ee57c862f29b24c13cf30e7cd4da99c9d5a2aa421a02ab11b7e56b4c8ca')process.exit(2);"
          npx --yes --package=esbuild@0.25.12 esbuild appdeploy_staging/chatgpt-auto-import.ts --format=esm --platform=node --packages=external --outfile=/tmp/chatgpt-auto-import.js
          npx --yes --package=esbuild@0.25.12 esbuild appdeploy_staging/chatgpt-direct-import.ts --format=esm --platform=node --packages=external --outfile=/tmp/chatgpt-direct-import.js
          npx --yes --package=esbuild@0.25.12 esbuild appdeploy_staging/motor-d-auto-import.ts --format=esm --platform=node --packages=external --outfile=/tmp/motor-d-auto-import.js
      - name: Verify channel isolation and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          index=json.loads((root/'automation/chatgpt_ready/index.json').read_text())
          assert 'seen_url_hashes' in index
          schema=json.loads((root/'automation/chatgpt_extraction_schema.json').read_text())
          assert schema['additionalProperties'] is False
          assert len(schema['properties']['comunas']['items']['enum']) >= 12
          patch=json.loads((root/'docs/APPDEPLOY_CHATGPT_V99_DEPLOYMENT_PATCH_20261113.json').read_text())
          assert any(f['filename']=='backend/chatgpt-url-identity.ts' for f in patch['files'])
          assert index['producer']=='chatgpt_territorial'
          bridge=(root/'appdeploy_staging/chatgpt-auto-import.ts').read_text()
          importer=(root/'appdeploy_staging/chatgpt-direct-import.ts').read_text()
          motor=(root/'appdeploy_staging/motor-d-auto-import.ts').read_text()
          assert "const ROOT='automation/chatgpt_ready/'" in bridge
          assert "db.get<Receipt>('chatgpt_import_receipts'" in bridge
          assert "chatgpt_territorial" in bridge
          assert "producer:'motor_d_territorial'" in motor
          assert "sourceProducer:producer" in importer
          assert "canonicalSourceHash(x.url_original)" in importer
          assert "urlHashSha256:urlHash" in importer
          assert "'motor-d-territorial'" in importer
          assert "'chatgpt-direct'" in importer
          print('Channel isolation + provenance checks PASS')
          PY
