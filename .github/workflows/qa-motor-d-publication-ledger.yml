name: Trabajo Cerca | Cierre de lotes D versus catálogo público
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'automation/qa_motor_d_manifest_public.py'
      - 'automation/test_qa_motor_d_manifest_public.py'
      - 'automation/motor_d_catalog_probe.py'
      - '.github/workflows/qa-motor-d-publication-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'automation/qa_motor_d_manifest_public.py'
      - 'automation/test_qa_motor_d_manifest_public.py'
      - 'automation/motor_d_catalog_probe.py'
      - '.github/workflows/qa-motor-d-publication-ledger.yml'
  schedule:
    # Twice per day, after the territorial scan and AppDeploy 15-minute importer.
    - cron: '47 9,17 * * *'
permissions:
  contents: read
concurrency:
  group: qa-motor-d-ledger-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile_public_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests de integridad de lotes, cuarentena y duplicación
        env:
          PYTHONPATH: automation
        run: python -m unittest discover -s automation -p 'test_qa_motor_d_manifest_public.py' -v
      - name: Contrastar lotes D con todo el catálogo público, sin publicar
        env:
          PYTHONPATH: automation
        run: python automation/qa_motor_d_manifest_public.py --output resultados/motor_d_reconciliacion.json
      - name: Conservar recibo incluso ante falla de feed o duplicados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-d-publication-ledger
          path: resultados/motor_d_reconciliacion.json
          if-no-files-found: warn
          retention-days: 14
