name: Trabajo Cerca | QA seguridad administrativa
on:
  pull_request:
    branches: [main]
    paths:
      - automation/trabajo_cerca/qa_admin_anon.py
      - .github/workflows/trabajo-cerca-admin-security.yml
  push:
    branches: [main]
    paths:
      - automation/trabajo_cerca/qa_admin_anon.py
      - .github/workflows/trabajo-cerca-admin-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardia:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar rechazo anónimo de 7 rutas administrativas
        run: python automation/trabajo_cerca/qa_admin_anon.py
      - name: Evidencia sin credenciales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trabajo-cerca-admin-security
          path: resultado_seguridad_admin.json
          retention-days: 3
