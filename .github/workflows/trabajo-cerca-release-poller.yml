name: Trabajo Cerca — OIDC autonomous release poller
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/trabajo-cerca-release-poller.yml

permissions:
  contents: read
  id-token: write
  actions: write
  issues: write

concurrency:
  group: trabajo-cerca-release-poller
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: OIDC signed poll; no credentials in laboratory
        id: poll
        run: |
          node --input-type=module <<'NODE'
          import { operationalLabApi } from './scripts/trabajo-cerca-environments.mjs';
          const laboratory=operationalLabApi();
          if(!laboratory) {
            console.log('Laboratorio operativo pendiente de identificación. Se omite la conexión.');
            process.exit(0);
          }
          const { appendFile }=await import('node:fs/promises');
          await appendFile(process.env.GITHUB_OUTPUT,'target_configured=true\n');
          const tokenUrl=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const tokenSecret=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          const output=process.env.GITHUB_OUTPUT;
          if(!tokenUrl||!tokenSecret||!output)throw Error('GitHub OIDC unavailable');
          const url=tokenUrl+(tokenUrl.includes('?')?'&':'?')+
            'audience=trabajo-cerca-release-poll-v1';
          const identity=await fetch(url,{headers:{Authorization:'Bearer '+tokenSecret},
            signal:AbortSignal.timeout(10000)});
          if(!identity.ok)throw Error('GitHub identity HTTP '+identity.status);
          const jwt=(await identity.json()).value;
          if(typeof jwt!=='string')throw Error('OIDC token missing');
          const r=await fetch(
            laboratory+'/api/internal/release/poll',
            {method:'POST',headers:{Authorization:'Bearer '+jwt,
              'Content-Type':'application/json'},body:JSON.stringify({action:'poll'}),
              signal:AbortSignal.timeout(18000)});
          if(!r.ok)throw Error('LAB poll HTTP '+r.status);
          const response=await r.json();
          if(response.pending!==true){
            if(response.verified!==true)throw Error('LAB response not signed');
            console.log('TC_RELEASE_OIDC_POLL_OK: no approved pending release');
            const fs=await import('node:fs/promises');
            await fs.appendFile(output,'pending=false\n');
            process.exit(0);
          }
          if(response.verified!==true||
            !/^[a-f0-9]{40}$/i.test(response.candidateSha||'')||
            !/^[0-9]{12,20}$/.test(response.baseline||''))
            throw Error('LAB candidate response invalid');
          const fs=await import('node:fs/promises');
          await fs.appendFile(output,'pending=true\n'+
            'candidate='+response.candidateSha+'\n'+
            'baseline='+response.baseline+'\n');
          console.log('TC_RELEASE_OIDC_CLAIMED: approved candidate');
          NODE
      - name: Request guarded production workflow with GitHub built-in token
        id: dispatch
        if: steps.poll.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.poll.outputs.candidate }}
          BASELINE: ${{ steps.poll.outputs.baseline }}
        run: |
          gh workflow run trabajo-cerca-release.yml --repo "${{ github.repository }}" \
            --ref main --field candidate_sha="$CANDIDATE_SHA" \
            --field production_baseline="$BASELINE" \
            --field dry_run=false
      - name: Signed acknowledgment; never retry ambiguous dispatch automatically
        if: always() && steps.poll.outputs.pending == 'true'
        env:
          CANDIDATE_SHA: ${{ steps.poll.outputs.candidate }}
          BASELINE: ${{ steps.poll.outputs.baseline }}
          ENQUEUED: ${{ steps.dispatch.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import { operationalLabApi } from './scripts/trabajo-cerca-environments.mjs';
          const laboratory=operationalLabApi();
          if(!laboratory) process.exit(0);
          const u=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const t=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          const auth=await fetch(u+(u.includes('?')?'&':'?')+
            'audience=trabajo-cerca-release-poll-v1',{
            headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(10000)});
          if(!auth.ok)throw Error('OIDC ack credential unavailable');
          const jwt=(await auth.json()).value;
          const r=await fetch(
            laboratory+'/api/internal/release/poll',
            {method:'POST',headers:{Authorization:'Bearer '+jwt,
              'Content-Type':'application/json'},
              body:JSON.stringify({action:'ack',candidateSha:process.env.CANDIDATE_SHA,
                baseline:process.env.BASELINE,
                enqueued:process.env.ENQUEUED==='true'}),
              signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error('Release dispatch acknowledgment HTTP '+r.status);
          console.log('TC_RELEASE_OIDC_ACK_RECORDED');
          NODE

      - name: Report initial OIDC polling result
        if: always() && github.event_name == 'push' && steps.poll.outputs.target_configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          POLL_OUTCOME: ${{ steps.poll.outcome }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$POLL_OUTCOME" = success ]; then
            BODY="Sondeo OIDC autónomo desde GitHub → LAB: **CONECTADO**. No se publicó ninguna versión sin certificados de respaldo y recuperación."
          else
            BODY="Sondeo OIDC autónomo GitHub → LAB: **PRUEBA FALLIDA**. No se autorizó ningún despliegue."
          fi
          gh issue comment 74 --repo "$REPO" --body "$BODY

          CI: https://github.com/$REPO/actions/runs/$RUN_ID"
