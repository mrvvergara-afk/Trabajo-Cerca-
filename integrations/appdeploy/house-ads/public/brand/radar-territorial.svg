<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Isotipo Radar Circular con Marcador de Ubicación Territorial fiel a la imagen -->
  <g id="radar-mark">
    <!-- Círculo exterior verde oscuro con bisel -->
    <circle cx="60" cy="60" r="54" fill="#0b3824" stroke="#052416" stroke-width="2"/>
    <circle cx="60" cy="60" r="48" fill="#0d462c" stroke="#16a34a" stroke-width="3"/>

    <!-- Retícula concéntrica del radar -->
    <circle cx="60" cy="60" r="38" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.45"/>
    <circle cx="60" cy="60" r="26" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.55"/>
    <circle cx="60" cy="60" r="14" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.6"/>

    <!-- Ejes cardinales de cuadrante -->
    <line x1="60" y1="12" x2="60" y2="108" stroke="#22c55e" stroke-width="1" opacity="0.35"/>
    <line x1="12" y1="60" x2="108" y2="60" stroke="#22c55e" stroke-width="1" opacity="0.35"/>

    <!-- Haz de barrido radar en degradado -->
    <path d="M 60 60 L 26 26 A 48 48 0 0 1 84 14 Z" fill="url(#radarSweep)" opacity="0.65"/>

    <!-- Puntos de proximidad / ecos en pantalla -->
    <circle cx="42" cy="74" r="2.5" fill="#86efac"/>
    <circle cx="82" cy="46" r="3" fill="#fef08a"/>
    <circle cx="50" cy="42" r="2" fill="#86efac" opacity="0.8"/>
    <circle cx="76" cy="78" r="2.2" fill="#4ade80"/>
    <circle cx="36" cy="54" r="1.8" fill="#86efac" opacity="0.7"/>

    <!-- Marcador / Pin territorial en primer plano (ángulo inferior derecho) -->
    <g transform="translate(68, 52) scale(0.92)">
      <path d="M 22 4 C 11.5 4 3 12.5 3 23 C 3 35.5 19 53 22 56 C 25 53 41 35.5 41 23 C 41 12.5 32.5 4 22 4 Z" fill="#ffffff" stroke="#052416" stroke-width="2.5"/>
      <circle cx="22" cy="22" r="9" fill="#0d462c"/>
      <circle cx="22" cy="22" r="4.5" fill="#22c55e"/>
    </g>
  </g>

  <!-- Tipografía de Marca Oficial -->
  <defs>
    <linearGradient id="radarSweep" x1="60" y1="60" x2="35" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
</svg>
