<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Radar con pin en escala optimizada para cabecera compacta móvil -->
  <g transform="translate(18, 6)">
    <!-- Círculo exterior verde oscuro -->
    <circle cx="50" cy="50" r="45" fill="#0b3824" stroke="#052416" stroke-width="2"/>
    <circle cx="50" cy="50" r="40" fill="#0d462c" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.5"/>
    <circle cx="50" cy="50" r="18" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.6"/>
    <line x1="50" y1="10" x2="50" y2="90" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="50" x2="90" y2="50" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <path d="M 50 50 L 22 22 A 40 40 0 0 1 70 12 Z" fill="#22c55e" opacity="0.6"/>
    <circle cx="68" cy="38" r="3" fill="#fef08a"/>
    <circle cx="34" cy="62" r="2.5" fill="#86efac"/>

    <!-- Pin territorial integrado -->
    <g transform="translate(56, 42) scale(0.85)">
      <path d="M 20 4 C 10 4 2 12 2 22 C 2 34 18 51 20 53 C 22 51 38 34 38 22 C 38 12 30 4 20 4 Z" fill="#ffffff" stroke="#052416" stroke-width="2.2"/>
      <circle cx="20" cy="21" r="8" fill="#0d462c"/>
      <circle cx="20" cy="21" r="4" fill="#22c55e"/>
    </g>
  </g>
  <!-- Texto apilado compacto -->
  <text x="80" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="13" fill="#08331e" letter-spacing="-0.02em">Trabajo<tspan fill="#16a34a">Cerca</tspan></text>
  <text x="80" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="5.5" fill="#15803d" letter-spacing="0.12em">RADAR TERRITORIAL</text>
</svg>
