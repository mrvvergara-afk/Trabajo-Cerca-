name: Trabajo Cerca - QA catalogo publico
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trabajo-cerca-qa-catalogo.yml'
permissions:
  contents: read
jobs:
  qa_public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmar la publicacion real y ausencia de duplicados
        run: |
          python - <<'PY'
          import json,urllib.request
          from urllib.parse import urlencode
          root='https://api-v2.appdeploy.ai/app/trabajo-cerca-laboratorio-3ojgro'
          target='https://www.chiletrabajos.cl/trabajo/se-buscan-enfierradores-nacimiento-3926105'
          def get(path):
              req=urllib.request.Request(root+path,headers={'Accept':'application/json','User-Agent':'TrabajoCercaPublicQA/1.0'})
              with urllib.request.urlopen(req,timeout=15) as resp:
                  assert resp.status==200,resp.status
                  return json.loads(resp.read(500000))
          cursor=None
          items=[]
          count=None
          for n in range(100):
              q=urlencode({'fresh':'1',**({'cursor':cursor} if cursor else {})})
              result=get('/api/listings?'+q)
              count=result.get('totalVerifiedJobOffers')
              items.extend(result.get('items') or [])
              cursor=result.get('nextCursor')
              if not cursor:break
          else:raise RuntimeError('Feed pagination did not terminate')
          matches=[x for x in items if x.get('url')==target]
          prior='https://www.chiletrabajos.cl/trabajo/m1-moldajero-obra-gruesa-hospital-de-nacimiento-contrato-a-trato-3887988'
          prior_matches=[x for x in items if x.get('url')==prior]
          print('PUBLIC_QA_RETENTION',json.dumps({'legacy_moldajero_matches':len(prior_matches),'title':prior_matches[0].get('title') if prior_matches else None},ensure_ascii=False))
          suspicious=[{'id':x.get('id'),'title':x.get('title'),'url':x.get('url')} for x in items if 'moldajero' in str(x.get('title') or '').lower() or '3887988' in str(x.get('url') or '')]
          print('PUBLIC_QA_MOLDAJERO_DEBUG',json.dumps(suspicious,ensure_ascii=False))
          # Do not fail until URL normalization and identity are inspected.
          print('PUBLIC_QA',json.dumps({'feed_verified':count,'items_read':len(items),'target_url':target,'target_matches':len(matches),'target_title':matches[0].get('title') if matches else None},ensure_ascii=False))
          assert len(matches)==1,'The real D test offer must appear exactly once'
          assert count>=159,'The visible public catalog did not advance to 159'
          for path in ('/api/ops/radar-feed','/api/ops/free-public-sources'):
              response=get(path)
              print('PUBLIC_QA_OPS',json.dumps({'path':path,'keys':list(response)[:12]},ensure_ascii=False))
          PY
