name: QA consolidada feed y motores B/C

on:
  pull_request:
    paths:
      - 'automation/qa_feed_bc_consolidado.py'
      - 'automation/test_qa_feed_bc_consolidado.py'
      - '.github/workflows/qa-feed-bc-consolidado.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probar escenarios sin acceso a producción
        run: python -m unittest discover -s automation -p 'test_qa_feed_bc_consolidado.py' -v
