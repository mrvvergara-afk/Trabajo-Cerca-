name: Motor D - CMPC browser discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: read
jobs:
  cmcp_discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.48,<2'
          python -m playwright install --with-deps chromium
      - name: Verify Python
        run: python -m py_compile automation/motor_d_cmpc_browser.py
      - name: Discover public CMPC requisitions
        run: python automation/motor_d_cmpc_browser.py
      - name: Upload evidence (not approved for publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-d-cmpc-evidence
          path: automation/motor_d_discovery/
          if-no-files-found: warn
