name: Stitch fidelity review (isolated, no deployment)
on:
  push:
    branches: [feature/redesign-stitch-2026-10]
    paths:
      - 'integrations/appdeploy/house-ads/**'
      - '.github/workflows/stitch-fidelity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stitch-fidelity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false && github.ref == 'refs/heads/feature/redesign-stitch-2026-10'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: integrations/appdeploy/house-ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked build and browser dependencies
        timeout-minutes: 4
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps --only-shell chromium
          fi
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Compile and capture React using the isolated SDK only
        run: node qa/stitch-run.mjs
      - name: Downloadable isolated preview and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trabajo-cerca-stitch-preview-and-comparisons
          path: |
            integrations/appdeploy/house-ads/qa-stitch-dist/
            integrations/appdeploy/house-ads/qa-output/stitch-fidelity/
          retention-days: 2
