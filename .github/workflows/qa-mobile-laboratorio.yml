name: Trabajo Cerca | QA visual móvil laboratorio

on:
  workflow_dispatch:
  push:
    paths:
      - 'automation/qa_mobile_experience.py'
      - '.github/workflows/qa-mobile-laboratorio.yml'

permissions:
  contents: read

concurrency:
  group: tc-mobile-lab-browser-qa
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA
        run: |
          python -m pip install 'playwright>=1.48,<2'
          python -m playwright install --with-deps chromium
      - name: Run mobile and desktop no-write UX check
        run: python automation/qa_mobile_experience.py
      - name: Keep QA screenshots and machine-readable summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trabajo-cerca-browser-qa
          path: qa-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
