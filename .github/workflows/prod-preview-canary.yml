name: Official app opt-in visual canary (read only)
on:
  push:
    branches:
      - qa/lab-release-smoke-20261120
    paths:
      - scripts/prod-preview-canary.mjs
      - .github/workflows/prod-preview-canary.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tc-official-preview-smoke
  cancel-in-progress: false
jobs:
  verify-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install independent browser test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Compare normal official view and opt-in preview, without writes
        run: node scripts/prod-preview-canary.mjs
