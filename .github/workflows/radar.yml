name: Radar local
on:
  workflow_dispatch:
    inputs:
      initialize_state:
        description: 'Crear el primer checkpoint solo después de revisar los artefactos anteriores'
        type: boolean
        default: false
  push:
    branches: [main, repair/radar-audit-2026-10-11]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'integrations/appdeploy/**'
      - '.github/workflows/radar.yml'
      - '.github/laboratory-pilot.json'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    # Revisión gratuita en repositorio público: pruebas aisladas, sin recolectores.
    if: github.ref == 'refs/heads/repair/radar-audit-2026-10-11' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar lectores gratuitos para las pruebas de OCR y PDF
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y poppler-utils tesseract-ocr tesseract-ocr-spa fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Probar sin red, credenciales ni escrituras a la app
        run: |
          python -m unittest discover -s tests -v
          for suite in tests/*.test.mjs; do node "$suite"; done
      - name: Observar la app mediante lectura del SDK sin ejecutar motores
        run: python scripts/observe_laboratory.py
      - name: Conservar la comprobación de lectura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-review-observation
          path: output/laboratory_observation*.json
          retention-days: 7
  scan:
    # La rama de reparación no ejecuta recolectores, crons ni publicaciones.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pruebas sin red ni servicios de pago
        run: |
          python -m unittest discover -s tests -v
          node tests/appdeploy-repair.test.mjs
          node tests/appdeploy-public-feed.test.mjs
          node tests/appdeploy-ingestion.test.mjs
          node tests/verification-schedule.test.mjs
          node tests/workflow-checkpoint.test.mjs
          node tests/appdeploy-local-evidence.test.mjs
          node tests/appdeploy-social-evidence.test.mjs
          node tests/appdeploy-social-evidence-store.test.mjs
          node tests/appdeploy-social-repair.test.mjs
          node tests/appdeploy-age-policy.test.mjs
      - name: Localizar checkpoint anterior
        id: checkpoint
        uses: actions/github-script@v7
        env:
          INITIALIZE_STATE: ${{ inputs.initialize_state }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const response = await github.rest.actions.listArtifactsForRepo({
              owner, repo, name: 'radar-checkpoint', per_page: 100
            });
            const artifacts = response.data.artifacts
              .filter(a => a.workflow_run?.head_branch === branch &&
                           a.workflow_run?.id !== context.runId)
              .sort((a, b) => b.id - a.id);
            const latest = artifacts[0];
            if (latest?.expired) {
              throw new Error('Checkpoint expirado: restaurar un respaldo; no reiniciar el histórico.');
            }
            if (latest) {
              core.setOutput('run_id', String(latest.workflow_run.id));
            } else if (process.env.INITIALIZE_STATE !== 'true') {
              throw new Error('No hay checkpoint durable. Revisar artefactos anteriores y autorizar la primera inicialización manual.');
            } else {
              const legacyResponse = await github.rest.actions.listArtifactsForRepo({
                owner, repo, name: 'radar-candidatos', per_page: 100
              });
              const legacy = legacyResponse.data.artifacts
                .filter(a => a.workflow_run?.head_branch === branch && !a.expired &&
                             a.workflow_run?.id !== context.runId)
                .sort((a, b) => b.id - a.id)[0];
              if (legacy) core.setOutput('legacy_run_id', String(legacy.workflow_run.id));
              core.warning('Primera inicialización explícita. Se importarán los últimos candidatos disponibles; los artefactos no sustituyen un respaldo durable.');
            }
      - name: Recuperar candidatos anteriores para la primera inicialización
        if: steps.checkpoint.outputs.legacy_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: radar-candidatos
          path: historical_artifacts/
          github-token: ${{ github.token }}
          run-id: ${{ steps.checkpoint.outputs.legacy_run_id }}
      - name: Importar el histórico disponible sin publicar
        if: steps.checkpoint.outputs.legacy_run_id != ''
        run: python scripts/import_artifacts.py historical_artifacts/
      - name: Restaurar estado
        if: steps.checkpoint.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: radar-checkpoint
          path: state/
          github-token: ${{ github.token }}
          run-id: ${{ steps.checkpoint.outputs.run_id }}
      - name: Comprobar restauración
        if: steps.checkpoint.outputs.run_id != ''
        run: |
          python -c "import sqlite3; from pathlib import Path; p=Path('state/radar.sqlite3'); assert p.exists(), 'Checkpoint faltante'; c=sqlite3.connect('file:state/radar.sqlite3?mode=ro',uri=True); assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'; c.close()"
      - name: Recolectar y preparar ingesta local
        id: pipeline
        run: python scripts/pipeline.py
        env:
          VERIFY_LIMIT: '60'
          RADAR_BUDGET_SECONDS: '1100'
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
          APIFY_RUN_ENABLED: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-candidatos
          path: output/
          retention-days: 7
      - name: Validar checkpoint antes de conservarlo
        id: checkpoint_valid
        if: always() && steps.pipeline.outcome != 'skipped' && hashFiles('state/radar.sqlite3') != ''
        run: |
          python -c "import sqlite3; c=sqlite3.connect('file:state/radar.sqlite3?mode=ro',uri=True); assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'; c.close()"
      - name: Conservar checkpoint
        uses: actions/upload-artifact@v4
        if: always() && steps.checkpoint_valid.outcome == 'success'
        with:
          name: radar-checkpoint
          path: state/radar.sqlite3
          retention-days: 7
  laboratory:
    # Explicit bounded pilot in the public repository. Never runs on main or on a schedule.
    if: >-
      github.ref == 'refs/heads/repair/radar-audit-2026-10-11' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[lab pilot]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.initialize_state == true))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pruebas antes del piloto
        run: |
          python -m unittest discover -s tests -v
          node tests/appdeploy-repair.test.mjs
          node tests/appdeploy-public-feed.test.mjs
          node tests/appdeploy-ingestion.test.mjs
          node tests/verification-schedule.test.mjs
          node tests/workflow-checkpoint.test.mjs
          node tests/appdeploy-local-evidence.test.mjs
          node tests/appdeploy-social-evidence.test.mjs
          node tests/appdeploy-social-evidence-store.test.mjs
          node tests/appdeploy-social-repair.test.mjs
          node tests/appdeploy-age-policy.test.mjs
      - name: Localizar respaldo durable o histórico anterior
        id: laboratory_history
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.repository?.private === true) throw new Error('El piloto solo está habilitado en el repositorio público; no consumir minutos privados de pago.');
            const { owner, repo } = context.repo;
            const fs = require('node:fs');
            try {
              const response = await github.rest.git.getRef({ owner, repo, ref:'heads/radar-state-laboratorio' });
              core.setOutput('parent', response.data.object.sha);
              return;
            } catch (cause) {
              if (cause.status !== 404) throw cause;
            }
            const available = [];
            for (let page = 1; page <= 10; page++) {
              const response = await github.rest.actions.listArtifactsForRepo({ owner, repo, name:'radar-candidatos', per_page:100, page });
              available.push(...response.data.artifacts.filter(item => !item.expired && item.workflow_run?.head_branch === 'main'));
              if (response.data.artifacts.length < 100) break;
              if (page === 10) throw new Error('Histórico demasiado grande; conservarlo y preparar importación por checkpoints.');
            }
            if (!available.length || available.length > 64 || available.reduce((n,a) => n + a.size_in_bytes, 0) > 16 * 1024 * 1024) {
              throw new Error('Primera inicialización bloqueada: falta histórico o supera el límite seguro.');
            }
            fs.mkdirSync('historical_archives', { recursive:true });
            for (const artifact of available) {
              const response = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id:artifact.id, archive_format:'zip' });
              fs.writeFileSync('historical_archives/' + artifact.id + '.zip', Buffer.from(response.data));
            }
            core.info('Se conservarán ' + available.length + ' archivos históricos disponibles de main.');
      - name: Recuperar la rama de datos sin modificar la reparación
        if: steps.laboratory_history.outputs.parent != ''
        run: git fetch origin refs/heads/radar-state-laboratorio:refs/remotes/origin/radar-state-laboratorio
      - name: Restaurar o importar sin reiniciar historial
        run: python scripts/prepare_laboratory_history.py
        env:
          RADAR_DATA_PARENT: ${{ steps.laboratory_history.outputs.parent }}
      - name: Piloto de una comuna y tres verificaciones, con respaldo y prueba firmada
        run: python scripts/laboratory_exchange.py
        env:
          RADAR_REPOSITORY_ID: ${{ github.repository_id }}
          RADAR_DATA_PARENT: ${{ steps.laboratory_history.outputs.parent }}
      - name: Comprobar IDs publicados mediante el SDK de lectura de la app
        run: python scripts/observe_laboratory.py
      - name: Conservar diagnóstico del piloto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-laboratory-pilot
          path: output/
          retention-days: 7
  laboratory-read:
    if: >-
      github.ref == 'refs/heads/repair/radar-audit-2026-10-11' &&
      github.event_name == 'push' && contains(github.event.head_commit.message, '[lab read]')
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar respaldo durable sin consultar proveedores
        run: |
          git fetch origin refs/heads/radar-state-laboratorio:refs/remotes/origin/radar-state-laboratorio
          python -c "from scripts.laboratory_exchange import restore_from_git; print(restore_from_git('state/radar.sqlite3'))"
          python -c "import os,subprocess; from pathlib import Path; sha=subprocess.check_output(['git','rev-parse','refs/remotes/origin/radar-state-laboratorio'],text=True).strip(); Path(os.environ['GITHUB_ENV']).open('a').write('RADAR_DATA_PARENT='+sha+'\n')"
      - name: Observar el SDK y respaldar IDs confirmados
        run: python scripts/monitor_laboratory.py
      - name: Conservar prueba de lectura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-laboratory-read
          path: output/
          retention-days: 7
