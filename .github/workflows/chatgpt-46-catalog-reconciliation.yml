name: ChatGPT 46 fichas - conciliacion catalogo publico real
on:
  workflow_dispatch:
  push:
    branches:
      - fix/chatgpt-autonomo-origen-diseno-20261113
    paths:
      - 'automation/reconcile_chatgpt_46_live.py'
      - 'automation/chatgpt_20261113_46_urls.txt'
      - '.github/workflows/chatgpt-46-catalog-reconciliation.yml'
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only catalog parser dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Verify batch shape and URL identity
        env:
          PYTHONPATH: automation
        run: |
          python - <<'PY'
          from pathlib import Path
          from chatgpt_extraction_contract import url_hash
          urls=Path('automation/chatgpt_20261113_46_urls.txt').read_text().splitlines()
          assert len(urls)==46 and len({url_hash(s) for s in urls})==46
          print('CHATGPT_46_INPUT_VERIFIED',len(urls))
          PY
      - name: Fetch complete live AppDeploy catalog, compare 46 and save evidence
        env:
          PYTHONPATH: automation
        run: python automation/reconcile_chatgpt_46_live.py
      - name: Preserve exact public ID results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-46-live-catalog-check
          path: output/chatgpt_46_live_reconciliation.json
          if-no-files-found: warn
